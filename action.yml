name: 'Validate IntentSpec'
description: 'Validate IntentSpec — the portable handoff format for evidence-backed AI agent intent. Catches malformed specs, missing fields, and broken evidence anchors.'
inputs:
  file:
    description: 'Path to the intent file'
    required: false
    default: 'intent.md'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'check-circle'
  color: 'purple'
